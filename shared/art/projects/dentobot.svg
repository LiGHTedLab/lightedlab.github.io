<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
  <!-- Concept art: precise, stabilised instrument guidance inside a root canal (no device detail) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06121f"/><stop offset="1" stop-color="#0f0b2a"/></linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="dentin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde7c7"/><stop offset="1" stop-color="#e7b98a"/></linearGradient>
    <linearGradient id="tool" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/></linearGradient>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#22d3ee" stroke-opacity=".07"/></pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <rect width="640" height="400" fill="url(#grid)"/>
  <!-- molar with two roots -->
  <g transform="translate(250 70)">
    <path d="M10 60 C0 20 30 0 60 12 C80 2 100 2 120 12 C150 0 180 20 170 60 C164 100 160 120 150 170 C144 210 140 270 120 280 C104 286 100 230 96 200 C92 186 88 186 84 200 C80 230 76 286 60 280 C40 270 36 210 30 170 C20 120 16 100 10 60 Z" fill="url(#enamel)"/>
    <path d="M26 66 C22 38 44 26 64 34 C80 26 100 26 116 34 C136 26 158 38 154 66 C150 96 146 120 138 160 C134 196 128 240 118 258 C110 230 106 200 102 184 C96 168 84 168 78 184 C74 200 70 230 62 258 C52 240 46 196 42 160 C34 120 30 96 26 66 Z" fill="url(#dentin)"/>
    <!-- pulp chamber and canals -->
    <path d="M60 70 C70 60 110 60 120 70 C122 90 118 104 112 112 C116 150 120 200 116 246 M68 112 C62 104 58 90 60 70 M68 112 C64 150 60 200 64 246" stroke="#fb7185" stroke-width="7" fill="none" stroke-linecap="round" opacity=".85"/>
    <!-- instrument following the canal -->
    <path d="M118 -40 L114 112 C116 150 118 196 116 236" stroke="url(#tool)" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <circle cx="116" cy="236" r="5" fill="#22d3ee"/>
    <circle cx="116" cy="236" r="14" fill="none" stroke="#22d3ee" stroke-dasharray="3 4"/>
  </g>
  <!-- stabilising guidance: abstract compact module with motion-compensation arcs -->
  <g transform="translate(330 14)">
    <rect x="16" y="0" width="76" height="34" rx="10" fill="#1e1b4b" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="38" cy="17" r="6" fill="#a78bfa"/><circle cx="70" cy="17" r="6" fill="#22d3ee"/>
  </g>
  <g fill="none" stroke="#a78bfa" stroke-opacity=".55" stroke-width="2">
    <path d="M300 30 C285 45 285 70 300 86"/><path d="M450 30 C465 45 465 70 450 86"/>
    <path d="M286 22 C264 46 264 78 286 100" stroke-opacity=".3"/><path d="M464 22 C486 46 486 78 464 100" stroke-opacity=".3"/>
  </g>
  <g font-family="Inter, Segoe UI, sans-serif" fill="#e2e8f0">
    <text x="28" y="40" font-size="13" font-weight="600" letter-spacing="2" opacity=".85">DENTOBOT · GUIDED ROOT CANAL</text>
    <text x="28" y="372" font-size="12.5" opacity=".7">Concept: stabilised, precise instrument guidance for minimally invasive endodontics</text>
    <text x="470" y="320" font-size="12.5" fill="#67e8f9">target apex</text>
    <path d="M466 316 L380 306" stroke="#67e8f9" stroke-opacity=".5"/>
  </g>
</svg>
