<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800"><rect width="1280" height="800" fill="#ffffff"/><text x="640.0" y="40.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="700" fill="#1e2a5a" text-anchor="middle">DentoBot: Patient-referenced Robotic Guidance for Root Canal Treatment</text><text x="640.0" y="66.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">Concept illustration: generic workflow and control principle (no specific mechanism shown)</text><rect x="24" y="86" width="292" height="156" rx="12" fill="#ffffff" stroke="#2563eb" stroke-width="2.4"/><text x="40.0" y="114.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#2563eb" text-anchor="start">1  Plan</text><text x="40.0" y="142.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">3D imaging (CBCT /</text><text x="40.0" y="162.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">intra-oral scan)</text><text x="40.0" y="182.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">→ access cavity and canal</text><text x="40.0" y="202.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">trajectory, working length</text><path d="M318.0,164.0 L334.0,164.0" fill="none" stroke="#2563eb" stroke-width="3.5" stroke-linejoin="round"/><path d="M334.0,164.0 L325.0,168.3 L325.0,159.7 Z" fill="#2563eb"/><rect x="336" y="86" width="292" height="156" rx="12" fill="#ffffff" stroke="#7c3aed" stroke-width="2.4"/><text x="352.0" y="114.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#7c3aed" text-anchor="start">2  Register</text><text x="352.0" y="142.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">Patient-worn reference</text><text x="352.0" y="162.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">(bite block / splint with</text><text x="352.0" y="182.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">fiducials) links the plan</text><text x="352.0" y="202.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">to the patient: T(image→tooth)</text><path d="M630.0,164.0 L646.0,164.0" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linejoin="round"/><path d="M646.0,164.0 L637.0,168.3 L637.0,159.7 Z" fill="#7c3aed"/><rect x="648" y="86" width="292" height="156" rx="12" fill="#ffffff" stroke="#ea580c" stroke-width="2.4"/><text x="664.0" y="114.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#ea580c" text-anchor="start">3  Guide</text><text x="664.0" y="142.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">Motorised precision axes</text><text x="664.0" y="162.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">align the instrument with</text><text x="664.0" y="182.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">the planned axis and</text><text x="664.0" y="202.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">follow head motion</text><path d="M942.0,164.0 L958.0,164.0" fill="none" stroke="#ea580c" stroke-width="3.5" stroke-linejoin="round"/><path d="M958.0,164.0 L949.0,168.3 L949.0,159.7 Z" fill="#ea580c"/><rect x="960" y="86" width="292" height="156" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="2.4"/><text x="976.0" y="114.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#16a34a" text-anchor="start">4  Treat &amp; verify</text><text x="976.0" y="142.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">Controlled advance to</text><text x="976.0" y="162.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">working length; force and</text><text x="976.0" y="182.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">position limits; record</text><text x="976.0" y="202.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" font-weight="400" fill="#1e2a5a" text-anchor="start">for audit</text><rect x="24" y="258" width="520" height="522" rx="14" fill="#f8fafc" stroke="#1e2a5a" stroke-width="1.6"/><text x="42.0" y="286.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2a5a" text-anchor="start">Planned access along the canal axis</text><g transform="translate(150,300)"><path d="M20,90 C0,40 40,10 80,26 C110,12 140,12 170,26 C210,10 250,40 230,90 C222,140 216,170 202,240 C194,300 186,380 160,394 C138,402 132,320 126,282 C122,262 116,262 112,282 C106,320 100,402 78,394 C52,380 44,300 36,240 C22,170 20,140 20,90 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/><path d="M42,96 C38,60 70,44 98,56 C118,46 146,46 166,56 C194,44 226,60 210,96 C204,136 198,168 186,226 C180,276 172,340 158,366 C148,330 142,292 136,270 C128,248 108,248 100,270 C94,292 88,330 80,366 C66,340 58,276 52,226 C40,168 36,136 42,96 Z" fill="#fde7c7" stroke="#d6a671"/><path d="M86,104 C100,92 156,92 170,104 C172,124 166,140 160,148 C166,200 170,270 164,350 M96,148 C90,140 84,124 86,104 M96,148 C90,200 86,270 92,350" stroke="#f43f5e" stroke-width="8" fill="none" stroke-linecap="round"/></g><path d="M314,304 L314,640" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="8 6"/><path d="M300,304 L328,304 L320,640 L308,640 Z" fill="#2563eb" opacity=".10"/><rect x="309" y="300" width="10" height="56" rx="3" fill="#475569"/><text x="330.0" y="326.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="700" fill="#2563eb" text-anchor="start">planned trajectory</text><text x="330.0" y="342.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="start">± tolerance cone</text><line x1="340.0" y1="392.0" x2="400.0" y2="392.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/><text x="404.0" y="396.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1e2a5a" text-anchor="start">access cavity / pulp chamber</text><line x1="340.0" y1="448.0" x2="400.0" y2="448.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/><text x="404.0" y="452.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1e2a5a" text-anchor="start">canal orifice</text><line x1="340.0" y1="632.0" x2="400.0" y2="632.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/><text x="404.0" y="636.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1e2a5a" text-anchor="start">working length</text><line x1="340.0" y1="652.0" x2="400.0" y2="652.0" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/><text x="404.0" y="656.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#1e2a5a" text-anchor="start">apex</text><text x="42.0" y="708.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Aim: reproducible, minimally invasive access that conserves dentine</text><text x="42.0" y="728.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#475569" text-anchor="start">and reduces errors such as perforation, ledging and gouging.</text><rect x="560" y="258" width="696" height="522" rx="14" fill="#ffffff" stroke="#1e2a5a" stroke-width="1.6"/><text x="578.0" y="286.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2a5a" text-anchor="start">Closed-loop, patient-referenced control (block diagram)</text><rect x="588" y="320" width="160" height="56" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/><text x="668.0" y="344.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e2a5a" text-anchor="middle">Planned path</text><text x="668.0" y="359.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e2a5a" text-anchor="middle">(from 3D imaging)</text><rect x="800" y="320" width="140" height="56" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.6"/><text x="870.0" y="352.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e2a5a" text-anchor="middle">Controller</text><rect x="990" y="320" width="220" height="56" rx="8" fill="#fff7ed" stroke="#ea580c" stroke-width="1.6"/><text x="1100.0" y="344.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e2a5a" text-anchor="middle">Motorised precision axes</text><text x="1100.0" y="359.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e2a5a" text-anchor="middle">(position + orientation)</text><rect x="990" y="430" width="220" height="56" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/><text x="1100.0" y="454.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e2a5a" text-anchor="middle">Endodontic instrument</text><text x="1100.0" y="469.5" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#1e2a5a" text-anchor="middle">in the tooth</text><path d="M748.0,348.0 L798.0,348.0" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/><path d="M798.0,348.0 L789.0,352.3 L789.0,343.7 Z" fill="#2563eb"/><path d="M940.0,348.0 L988.0,348.0" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linejoin="round"/><path d="M988.0,348.0 L979.0,352.3 L979.0,343.7 Z" fill="#7c3aed"/><path d="M1100.0,376.0 L1100.0,428.0" fill="none" stroke="#ea580c" stroke-width="3" stroke-linejoin="round"/><path d="M1100.0,428.0 L1095.7,419.0 L1104.3,419.0 Z" fill="#ea580c"/><rect x="800" y="430" width="140" height="56" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="870.0" y="462.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#1e2a5a" text-anchor="middle">Sensing</text><path d="M988.0,458.0 L942.0,458.0" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/><path d="M942.0,458.0 L951.0,453.7 L951.0,462.3 Z" fill="#475569"/><path d="M870.0,430.0 L870.0,378.0" fill="none" stroke="#475569" stroke-width="2.5" stroke-linejoin="round"/><path d="M870.0,378.0 L874.3,387.0 L865.7,387.0 Z" fill="#475569"/><text x="800.0" y="506.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">• axis encoders (position)</text><text x="800.0" y="524.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">• force / torque at the tool</text><text x="800.0" y="542.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#1e2a5a" text-anchor="start">• patient-reference tracking</text><rect x="588" y="590" width="640" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/><text x="606.0" y="616.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#1e2a5a" text-anchor="start">Safety and clinician control</text><text x="606.0" y="642.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">• Robot mounted relative to the patient, so small head movements do not shift the plan</text><text x="606.0" y="666.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">• Virtual boundaries: stop if deviation or force exceeds limits, or at working length</text><text x="606.0" y="690.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">• Clinician in the loop: approve plan, hold-to-run, instant manual override</text><text x="606.0" y="714.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">• Every step logged for training, audit and outcome studies</text></svg>
