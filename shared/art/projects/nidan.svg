"Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">  vascular biochemistry (HSI)</text><text x="910.0" y="535.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">• Each modality alone gives</text><text x="910.0" y="554.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">  false positives the other</text><text x="910.0" y="573.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">  can resolve</text><text x="910.0" y="592.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">• Fusion targets higher</text><text x="910.0" y="611.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">  specificity at the chair side</text><rect x="24" y="716" width="1232" height="64" rx="12" fill="#1e3a8a" stroke="#1e3a8a" stroke-width="0"/><text x="640.0" y="756.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" fill="#ffffff" text-anchor="middle">Final goal: portable, real-time, non-invasive detection of oral dysplasia and early cancer</text></svg>
