t-size="13" font-weight="400" fill="#1e2a5a" text-anchor="start">• Clinical readiness</text><path d="M330.0,388.0 L330.0,404.0 L1150.0,404.0 L1150.0,388.0" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 6"/><path d="M1150.0,388.0 L1154.3,397.0 L1145.7,397.0 Z" fill="#94a3b8"/><text x="740.0" y="398.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle" font-style="italic">iterative refinement between work packages</text><rect x="24" y="420" width="1232" height="280" rx="14" fill="#ffffff" stroke="#1e2a5a" stroke-width="1.6"/><text x="42.0" y="448.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="700" fill="#1e2a5a" text-anchor="start">Why fuse OCT and HSI?</text><rect x="44" y="466" width="250" height="150" fill="#050507"/><rect x="44" y="482" width="250" height="134" fill="#d4d4d8" filter="url(#spk2)"/><path d="M44,482 L294,482 L294,542 C240,530 200,548 170,548 C140,560 100,536 44,540 Z" fill="#050507"/><path d="M44,482 L294,482 L294,542 C240,530 200,548 170,548 C140,560 100,536 44,540 Z" fill="#52525b" filter="url(#spk2)" opacity=".5"/><path d="M44,482 L294,482" stroke="#fafafa" stroke-width="2.5"/><path d="M44,540 C100,536 140,560 170,548 S240,530 294,542" stroke="#fde68a" stroke-width="3" fill="none"/><text x="169.0" y="636.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="700" fill="#1e2a5a" text-anchor="middle">OCT: layered micro-structure</text><text x="169.0" y="653.0" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11.5" font-weight="400" fill="#475569" text-anchor="middle">epithelium, basement membrane, depth</text><line x1="350.0" y1="610.0" x2="610.0" y2="610.0" stroke="#475569" stroke-width="1.4"/><line x1="350.0" y1="470.0" x2="350.0" y2="610.0" stroke="#475569" stroke-width="1.4"/><path d="M350.0,563.3 C356.5,561.8 376.0,561.8 389.0,554.0 C402.0,546.2 416.3,527.9 