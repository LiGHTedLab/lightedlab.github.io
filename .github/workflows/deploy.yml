# Builds both sites and publishes them to GitHub Pages.
# Runs on every push to main, every Monday (to refresh Google Scholar metrics), or by hand.
name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh Google Scholar metrics
        run: python tools/update_metrics.py

      - name: Commit updated metrics
        run: |
          if ! git diff --quiet -- data/metrics.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/metrics.json
            git commit -m "Update Google Scholar metrics"
            git push
          fi

      - name: Build sites
        run: python tools/package.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
